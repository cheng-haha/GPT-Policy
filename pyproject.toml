[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "gpt-policy"
version = "0.1.0"
description = "Shared native agent control loop for ARX and YAM robot arms"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "ruckig>=0.15.3,<=0.19.4", "Pillow>=10", "jsonschema>=4.23", "rich>=13,<15", "mcap-protobuf-support>=0.5.3,<1", "pyarrow>=18"]

[project.optional-dependencies]
arx = ["arx5-interface==0.1.3"]
yam = ["i2rt @ git+https://github.com/i2rt-robotics/i2rt.git@ac096928d6899ddf852a71c5e8fbaa6055cd9745"]
realsense = ["pyrealsense2"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
gpt-policy = "gpt_policy.main:main"
claude-policy = "gpt_policy.main:claude_main"
kimi-policy = "gpt_policy.main:kimi_main"

[tool.hatch.build.targets.wheel]
packages = ["src/gpt_policy"]

# The optional YAM backend intentionally pins an upstream Git revision.
# Hatchling requires this opt-in for PEP 508 direct references.
[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
